<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="artxDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080910" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>
    <linearGradient id="artxAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="artxWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Container with Refined Edge -->
  <rect width="100" height="100" rx="24" fill="url(#artxDarkBg)" />
  <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- The ARTX Master Mark -->
  <!-- Left Ascending Pillar of A -->
  <polygon points="22,82 43,18 57,18 36,82" fill="url(#artxWhiteGrad)" />

  <!-- Right Descending Pillar of A -->
  <polygon points="43,18 57,18 78,82 64,82 50,40" fill="url(#artxWhiteGrad)" />

  <!-- The Kinetic Solar Amber Blade (Forms X + Dynamic Crossbar) -->
  <!-- Upper Right Wing of Amber Blade -->
  <polygon points="80,20 66,20 48,50 62,50" fill="url(#artxAmberGrad)" />
  <!-- Lower Left Wing of Amber Blade -->
  <polygon points="40,64 26,82 12,82 26,64" fill="url(#artxAmberGrad)" />

  <!-- Amber Core Floating Crossbar (The A crossbar & X center lock) -->
  <polygon points="36,52 64,52 68,60 32,60" fill="url(#artxAmberGrad)" />
</svg>